<select id=\"task-status\" class=\"record-field\">'+['待排查','排查中','待复查','已复查','不适用'].map(x=>'<option '+(r.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label class=\"field\" for=\"task-owner\">负责角色</label><input type=\"text\" id=\"task-owner\" placeholder=\"例如：营销运营 / 数据分析\" value=\"'+esc(r.owner)+'\"><label class=\"field\" for=\"task-note\">证据、判断与下一步动作</label><textarea id=\"task-note\" placeholder=\"记录证据来源、已排除原因、计划动作和验证指标。只填写模拟内容。\">'+esc(r.note)+'</textarea><label class=\"field\" for=\"task-metric\">复查指标</label><input type=\"text\" id=\"task-metric\" placeholder=\"例如：领券后浏览率；同时关注支付转化与退款\" value=\"'+esc(r.metric)+'\"><div class=\"actions\" style=\"margin-top:16px\"><button id=\"save-task\" class=\"primary\">保存排查记录</button><button id=\"make-report\">生成诊断报告</button></div><p id=\"save-message\" class=\"toast\" role=\"status\">'+(storageOK?'记录仅存于当前浏览器；切换前会保存当前草稿。':'本地存储不可用，当前记录仅保留于页面会话，请复制报告保存。')+'</p></div></div></section><section class=\"panel\"><div class=\"panel-title\"><h2>已保存排查记录</h2><small>跨场景任务列表</small></div>'+recordTable()+'</section><section class=\"panel\"><h2>当前诊断报告</h2><p class=\"muted\">点击生成后可复制文本保存，也可下载TXT。</p><textarea id=\"report-text\" aria-label=\"诊断报告文本\" readonly></textarea><button id=\"download-report\" style=\"margin-top:12px\">下载报告TXT</button></section>'}\nfunction recordTable(){const rows=Object.entries(records).filter(([k,r])=>r&&typeof r==='object'&&SCENES.some(s=>k.startsWith(s.id+'-')));if(!rows.length)return'<p class=\"empty\">还没有排查记录。完成一次检查后，保存你的判断。</p>';return'<div class=\"scroll\"><table><thead><tr><th>场景 / 批次</th><th>环节</th><th>状态</th><th>负责角色</th><th>下一步动作</th><th>操作</th></tr></thead><tbody>'+rows.map(([k,r])=>{const [s,w,i]=k.split('-'),si=SCENES.find(x=>x.id===s),wi=WEEKS.findIndex(x=>x.id===w),n=+i;if(!si||wi<0||n<1||n>5)return'';return'<tr><td>'+si.name+' / '+w+'</td><td>'+STAGES[n-1]+' → '+STAGES[n]+'</td><td><span class=\"badge\">'+esc(r.status||'待排查')+'</span></td><td>'+esc(r.owner||'待填写')+'</td><td>'+esc((r.note||'待填写').slice(0,80))+'</td><td><a href=\"'+href('operations.html',s,wi,n)+'\">打开任务</a></td></tr>'}).join('')+'</tbody></table></div>'}\nfunction renderPage(){const b=data();$('content').innerHTML=!valid(b)?'<p class=\"notice\">模拟数据校验失败，暂停诊断。</p>':page[0]==='index.html'?overview(b):page[0]==='funnel.html'?funnel(b):page[0]==='benefits.html'?benefits(b):operations(b);document.querySelectorAll('[data-stage]').forEach(e=>e.onclick=()=>{stage=+e.dataset.stage;portableHistory.replaceState(null,'',href(page[0]));shell()});if($('task-stage')){$('task-stage').onchange=()=>{persistDraft();stage=+$('task-stage').value;portableHistory.replaceState(null,'',href(page[0]));shell()};$('save-task').onclick=()=>{persistDraft(true);shell();$('save-message').textContent=storageOK?'已保存，刷新或切换页面可恢复。':'本地存储不可用，记录仅保留在页面会话。'};$('make-report').onclick=makeReport;$('download-report').onclick=downloadReport}}\nfunction draft(){return{status:$('task-status').value,owner:$('task-owner').value,note:$('task-note').value,metric:$('task-metric').value,checks:[...document.querySelectorAll('[data-check]:checked')].map(e=>+e.dataset.check),savedAt:new Date().toISOString()}}\nfunction persistDraft(force=false){if(!$('task-note'))return;const r=draft();if(!force&&!records[recordKey()]&&r.status==='待排查'&&!r.owner&&!r.note&&!r.metric&&!r.checks.length)return;records[recordKey()]=r;try{portableStorage.setItem(KEY,JSON.stringify(records));storageOK=true}catch{storageOK=false}}\nfunction makeReport(){const b=data(),r=draft();$('report-text').value=['营销权益与用户增长诊断工作台 v0.3','模拟演示，不代表企业实绩；规则诊断，无在线AI调用','数据截至：'+ASOF,'场景：'+b.scene.name+'；领取批次：'+b.label,'观察状态：'+(mature(b)?'满14天':'观察中，仅累计进度'),'环节：'+STAGES[stage-1]+' → '+STAGES[stage],'人数：'+b.n[stage-1]+' → '+b.n[stage],'阶段转化：'+ratio(b.n[stage],b.n[stage-1]),'流失比例：'+percent(loss(b,stage)),'用券支付：'+b.n[5]+'人；全额退款：'+b.refund+'人，退款不扣支付人数','证据ID：'+sceneId+'-'+b.id+'；来源：合成计数，原因待验证','券规则：满500减50，活动内全部产品，领券后14天有效','状态：'+r.status+'；负责角色：'+(r.owner||'待填写'),'检查项：'+(r.checks.map orted.name:'内置模拟数据'}\nfunction recordScope(){KEY=imported?'growth-tasks-'+imported.id:'benefit-growth-workbench-v03';try{records=JSON.parse(portableStorage.getItem(KEY)||'{}')||{};}catch{records={}}}\nrecordScope();\nshell=function(){baseShell();const banner=document.createElement('div');banner.className='source-banner';banner.textContent=datasetLabel()+' · '+(imported?'事件校验通过；完整性仍需源系统核验':'分组数据为合成事件演示，不代表企业实绩');document.querySelector('main').insertBefore(banner,$('content'));}\nrenderPage=function(){const b=data();if(page[0]==='data.html'){$('content').innerHTML=dataPage();bindData();return}if(page[0]==='audience.html'){$('content').innerHTML=audiencePage(b);bindAudience();return}if(page[0]==='review.html'){$('content').innerHTML=reviewPage(b);bindReview();return}\n if(b.unavailable){$('content').innerHTML='<section class=\"panel\"><h2>当前场景与批次暂无数据</h2><p>导入文件没有此组合。请选择有数据的场景与批次，或回到数据页恢复内置示例。</p><a href=\"'+href('data.html')+'\">查看数据与质量 →</a></section>';return}baseRenderPage();};\nmakeReport=function(){baseMakeReport();$('report-text').value=$('report-text').value.replace('v0.3','v0.4')+'\\n数据来源：'+datasetLabel()+'\\n数据标识：'+(imported?imported.id:'built-in-v04')};\nfunction qualityHTML(){if(!qualityResult)return'<p class=\"empty\">选择JSON文件并点击“校验文件”，即可查看错误、警告与是否可应用。</p>';const q=qualityResult;return'<div class=\"metric-row\"><div>记录行数<strong>'+q.total+'</strong></div><div>错误<strong>'+q.errors.length+'</strong></div><div>警告<strong>'+q.warnings.length+'</strong></div></div><p class=\"notice\">'+(q.passed?'校验通过，可应用为全工作台的数据源。':'校验未通过，禁止应用；当前工作台数据保持不变。')+'</p><p class=\"muted\">文件：'+esc(qualityFilename)+'；最多展示前100条问题。</p><div class=\"scroll\"><table><thead><tr><th>级别</th><th>行号 / 位置</th><th>问题</th></tr></thead><tbody>'+q.issues.map(i=>'<tr><td>'+ (i.type==='error'?'错误':'提示')+'</td><td>'+esc(i.row)+'</td><td>'+esc(i.message)+'</td></tr>').join('')+'</tbody></table></div>'}\nfunction dataPage(){return'<section class=\"panel\"><div class=\"panel-title\"><h2>导入匿名事件数据</h2><span cl indSample(); $('validate-file').onclick=async()=>{const f=$('event-file').files[0];if(!f){$('import-message').textContent='请先选择JSON文件。';return}qualityFilename=f.name;pendingInput=null;pendingText='';if(f.size>10*1024*1024){qualityResult={passed:false,total:0,errors:['文件超过10MB'],warnings:[],issues:[{type:'error',row:'文件',message:'文件超过10MB'}]};renderPage();return}\n  try{pendingText=await f.text();const parsed=JSON.parse(pendingText);qualityResult=GrowthData.validate(parsed);if(parsed.as_of!=='2026-10-02'){qualityResult.errors.push('本版数据截至时间须为2026-10-02');qualityResult.issues.push({type:'error',row:'文件',message:'本版数据截至时间须为2026-10-02'});qualityResult.passed=false}if(qualityResult.passed)pendingInput=parsed;}catch(e){qualityResult={passed:false,total:0,errors:['JSON格式无效'],warnings:[],issues:[{type:'error',row:'文件',message:'JSON格式无效，请检查括号、引号和逗号'}]}}renderPage();};\n $('apply-file').onclick=async()=>{if(!pendingInput||!qualityResult?.passed)return;const buckets={};pendingInput.rows.forEach(r=>{const k=r.scene+'-'+r.week;(buckets[k]??=[]).push(r)});const summaries={};for(const[k,rows]of Object.entries(buckets))summaries[k]={...GrowthData.aggregate(rows),segment:GrowthData.groups(rows,'segment'),channel:GrowthData.groups(rows,'channel'),joint:GrowthData.joint(rows),users:rows.length};const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pendingText));const id=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('');const candidate={version:1,id,name:qualityFilename,as_of:pendingInput.as_of,summaries,total:pendingInput.rows.length};try{portableStorage.setItem(IMPORT_KEY,JSON.stringify(candidate))}catch{$('import-message').textContent='浏览器存储不可用，未应用数据。可检查文件后在可用浏览器重试。';return}persistDraft();imported=candidate;recordScope();shell();$('import-message').textContent='已应用数据，全部页面使用当前已校验的模拟事件汇总。';};\n $('restore-data').onclick=()=>{try{portableStorage.removeItem(IMPORT_KEY)}catch{$('import-message').textContent='无法恢复数据源：浏览器存储不可用。';return}imported=nu {return decisionStore[decisionKey()]||{}}\nfunction decisionSave(){try{portableStorage.setItem('growth-decisions-v06',JSON.stringify(decisionStore));return true}catch{return false}}\nfunction decisionInput(id,label,value,type='text',hint=''){return '<label class=\"field\" for=\"'+id+'\">'+label+'</label><input id=\"'+id+'\" type=\"'+type+'\" value=\"'+esc(value??'')+'\" '+(type==='number'?'min=\"0\" step=\"any\"':'')+'>'+ (hint?'<small class=\"muted\">'+hint+'</small>':'')}\nfunction targetPanel(b){const r=decisionValue();return '<details class=\"panel\" open><summary>指标目标与判定口径</summary><p class=\"muted\">目标由运营设定；未设置时只描述现状。每个数据源、人群、渠道与环节独立保存。</p><div class=\"grid2\"><div><h3>'+STAGES[stage-1]+' → '+STAGES[stage]+'</h3><p>当前转化 '+ratio(b.n[stage],b.n[stage-1])+' · 分子 '+b.n[stage]+' / 分母 '+b.n[stage-1]+' 人</p><p>同一领取批次、匿名用户去重、按顺序发生，领券后14天内观察。退款单独呈现。</p><p class=\"notice\">直达商品、跨入口返回与跳过步骤的路径尚未纳入；此漏斗不能替代全部购买路径分析。</p></div><div>'+decisionInput('goal-rate','目标转化率（%）',r.goal,'number')+decisionInput('goal-min','判断所需最小分母人数',r.minimum,'number')+decisionInput('goal-source','目标依据 / 业务目的',r.goalSource,'text','例如：同口径历史基准或经团队确认的目标')+'<button id=\"save-goal\" class=\"primary\">保存目标</button><p id=\"goal-state\" role=\"status\">'+goalState(b,r)+'</p></div></div></details>'}\nfunction goalState(b,r){if(r.goal===''||r.goal==null||!r.goalSource)return '尚未设定完整目标及依据。';if(!mature(b))return '观察期未满，只展示累计进度。';if(!b.n[stage-1])return '分母为0，无法判断。';if(!r.minimum||b.n[stage-1]<Number(r.minimum))return '样本未达到设定的最低人数，暂不判定。';const gap=100*b.n[stage]/b.n[stage-1]-Number(r.goal);return (gap>=0?'达到设定目标':'低于设定目标')+'，差值 '+gap.toFixed(1)+' 个百分点。目标不代表行业标准。'}\nfunction evidencePanel(){const r=decisionValue();return '<details class=\"panel\" open><summary>失败原因与证据明细</summary><p class=\"notice\">未进入下一步 ≠ 操作失败。当前数据仅含阶段时间，未采集按钮曝光、点击、加载失败或错误码，因此原因占比暂不可计算。</p><div class=\"scroll\"><table><thead><tr><th>待验证假设</th><th>需要的证据</th><th>排查方式</th></tr></thead><tbody>'+causes(stage).map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class=\"grid2\"><div>'+decisionInput('ev-source','证据来源 / 编号',r.evidenceSource,'text','填写匿名聚合报告或测试编号，不填写用户个人信息')+decisionInput('ev-period','证据时间范围与筛选口径',r.evidencePeriod)+'</div><div><label class=\"field\" for=\"ev-status\">证据状态</label><select id=\"ev-status\">'+['未采集','已采集待核验','支持假设','不支持假设','证据不足'].map(v=>'<option '+(r.evidenceStatus===v?'selected':'')+'>'+v+'</option>').join('')+'</select><label class=\"field\" for=\"ev-finding\">观察事实与限制</label><textarea id=\"ev-finding\">'+esc(r.evidenceFinding||'')+'</textarea></div></div><button id=\"save-evidence\">保存证据</button><p id=\"evidence-state\" role=\"status\"></p></details>'}\nfunction loopPanel(b){const r=decisionValue(),baseline=r.baseline;return '<section class=\"panel\"><h2>调整与复查</h2><p class=\"muted\">先冻结调整前指标，再记录上线与复查。前后变化只表示关联；有对照实验才能进一步判断增量效果。</p><p>基线：'+(baseline?esc(baseline.label)+' · '+baseline.from+' → '+baseline.to+' 人 · '+ratio(baseline.to,baseline.from)+' · '+(baseline.mature?'完整观察':'观察中'): '尚未冻结')+'</p><button id=\"freeze-baseline\">冻结当前范围为基线</button><div class=\"grid2\"><div>'+decisionInput('loop-hypothesis','调整假设与具体动作',r.hypothesis)+decisionInput('loop-launch','上线日期',r.launch,'date')+decisionInput('loop-review','计划复查日期',r.reviewDate,'date')+decisionInput('loop-guardrail','护栏指标及允许范围',r.guardrail,'text','例如：退款率、用券支付率、净补贴；未采集金额时不要填估算值')+'</div><div>'+decisionInput('loop-from','复查上一步人数',r.afterFrom,'number')+decisionInput('loop-to','复查下一步人数',r.afterTo,'number')+decisionInput('loop-source','复查证据 / 同口径说明',r.afterSource)+'<label class=\"field\" for=\"loop-result\">复查结论、限制与下一步</label><textarea id=\"loop-result\">'+esc(r.result||'')+'</textarea></div></div><div class=\"actions\"><button id=\"save-loop\" class=\"primary\">保存复查记录</button></div><p id=\"loop-state\" role=\"status\">'+loopState(r)+'</p></section>'}\nfunction loopState(r){if(!r.baseline||r.afterFrom===''||r.afterFrom==null||r.afterTo===''||r.afterTo==null)return '尚缺基线或复查人数。';if(!r.afterSource)return '请补充复查证据与同口径说明。';if(!r.baseline.mature)return '基线观察期未满，不能评价最终变化。';if(!Number(r.afterFrom)||!r.baseline.from)return '分母为0，无法比较。';return '复查转化 '+ratio(Number(r.afterTo),Number(r.afterFrom))+'；相比基线 '+(100*(Number(r.afterTo)/Number(r.afterFrom)-r.baseline.to/r.baseline.from)).toFixed(1)+' 个百分点。需核对复查窗口完整、人群一致及护栏结果；不自动认定为调整收益。'}\nfunction persistDecision(values){decisionStore[decisionKey()]={...decisionValue(),...values,updatedAt:new Date().toISOString()};return decisionSave()?'已保存到当前浏览器。':'浏览器存储不可用，当前会话保留；请复制报告保存。'}\nrenderPage=function(){decisionRender();document.querySelectorAll('details > summary').forEach(e=>{if(e.textContent==='候选原因与所需证据')e.parentElement.remove()});if(workPage!=='funnel.html'||data().unavailable)return;const b=data();if(view==='funnel')$('content').insertAdjacentHTML('beforeend',targetPanel(b)+evidencePanel());if(view==='tasks')$('content').insertAdjacentHTML('beforeend',loopPanel(b));if($('save-goal'))$('save-goal').onclick=()=>{const goal=$('goal-rate').value,min=$('goal-min').value;if(goal===''||!Number.isFinite(+goal)||+goal<0||+goal>100||min===''||!Number.isInteger(+min)||+min<1){$('goal-state').textContent='请输入0–100的目标百分比和正整数最小人数。';return}const msg=persistDecision({goal,minimum:min,goalSource:$('goal-source').value});$('goal-state').textContent=msg+' '+goalState(b,decisionValue())};if($('save-evidence'))$('save-evidence').onclick=()=>{$('evidence-state').textContent=persistDecision({evidenceSource:$('ev-source').value,evidencePeriod:$('ev-period').value,evidenceStatus:$('ev-status').value,evidenceFinding:$('ev-finding').value})};if($('freeze-baseline')){$('freeze-baseline').onclick=()=>{if(decisionValue().baseline){$('loop-state').textContent='已存在冻结基线，保留原值以避免复查时覆盖。';return}persistDecision({baseline:{from:b.n[stage-1],to:b.n[stage],label:b.label,mature:mature(b),asOf:ASOF,scope:segmentFilter+' / '+channelFilter}});renderPage()};$('save-loop').onclick=()=>{const from=$('loop-from').value,to=$('loop-to').value;if((from!==''||to!=='')&&(from===''||to===''||!Number.isInteger(+from)||!Number.isInteger(+to)||+from<0||+to<0||+to>+from)){$('loop-state').textContent='复查人数须为非负整数，下一步人数不能超过上一步。';return}if($('loop-launch').value&&$('loop-review').value&&$('loop-review').value<$('loop-launch').value){$('loop-state').textContent='复查日期不能早于上线日期。';return}const msg=persistDecision({hypothesis:$('loop-hypothesis').value,launch:$('loop-launch').value,reviewDate:$('loop-review').value,guardrail:$('loop-guardrail').value,afterFrom:from,afterTo:to,afterSource:$('loop-source').value,result:$('loop-result').value});$('loop-state').textContent=msg+' '+loopState(decisionValue())}}};\nfunction decisionText(r){return ['目标：'+(r.goal??'未设定')+'%；最低分母：'+(r.minimum||'未设定')+'人；依据：'+(r.goalSource||'未填写'),'证据：'+(r.evidenceStatus||'未采集')+'；'+(r.evidenceSource||'无')+'；'+(r.evidencePeriod||''),'观察事实：'+(r.evidenceFinding||'无'),'调整动作：'+(r.hypothesis||'未填写')+'；上线：'+(r.launch||'未填写')+'；复查：'+(r.reviewDate||'未填写'),'冻结基线：'+(r.baseline?r.baseline.label+'；'+r.baseline.from+' → '+r.baseline.to+'人；截至'+r.baseline.asOf:'无'),'复查人数：'+(r.afterFrom??'未填写')+' → '+(r.afterTo??'未填写')+'；来源：'+(r.afterSource||'未填写'),'护栏：'+(r.guardrail||'未填写'),'复查比较：'+loopState(r),'复查结论：'+(r.result||'未填写')].join('\\n')}\nmakeReport=function(){decisionReport();$('report-text').value+='\\n\\n目标、证据与复查\\n'+decisionText(decisionValue())};\nbuildReviewText=function(){let output=decisionReview();const prefix=(imported?.id||'built-in-v04')+'|'+sceneId+'-';for(const [k,r] of Object.entries(decisionStore))if(k.startsWith(prefix)&& (reviewMode==='four'||k.startsWith(prefix+WEEKS[week].id+'-')))output+='\\n\\n'+taskLabel(k.split('|')[1])+'\\n'+decisionText(r);return output};\nshell();\n", "// 市场权益配置为独立模拟资产；不将原单券漏斗复制成八个市场的经营实绩。\nconst MARKETS=[['HK','香港','HKD',500,50],['TW','台湾','TWD',2000,200],['JP','日本','JPY',10000,1000],['GB','英国','GBP',100,10],['MY','马来西亚','MYR',300,30],['TH','泰国','THB',3000,300],['SG','新加坡','SGD',150,15],['KR','韩国','KRW',100000,10000]];\nconst marketBaseRender=
